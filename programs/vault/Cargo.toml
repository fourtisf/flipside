[package]
name = "coinside_vault"
version = "0.0.0"
description = "Coinside vault: holds user and pool SOL, co-signed withdrawals, balance roots"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "coinside_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
