# Requests for any host name this server doesn't serve, or for its bare IP address: close the connection.
# bootstrap.sh enables this as 000-coinside-catch-all only when no other site is already the default
# server, because Nginx allows one per port.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    include snippets/coinside-tls.conf;
    return 444;
}
