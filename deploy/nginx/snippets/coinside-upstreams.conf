# The ports Coinside's web and API processes listen on. bootstrap.sh installs this file with the ports from
# WEB_PORT and API_PORT in /etc/coinside/coinside.env; these are the defaults.
upstream coinside_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream coinside_api {
    server 127.0.0.1:4000;
    keepalive 16;
}
