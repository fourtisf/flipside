# Security headers for every coinside.fun response. A location that sets its own add_header stops
# inheriting these, so include this file there too.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Preview only: keeps the P0 prototype (simulated data) out of search results. Remove at launch.
add_header X-Robots-Tag "noindex, nofollow" always;
