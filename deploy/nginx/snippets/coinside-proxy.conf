# Common upstream settings. Each location adds the Connection header it needs (keep-alive or upgrade).
proxy_http_version 1.1;
proxy_set_header Host $host;
# Nginx is the edge, so the visitor's address replaces whatever X-Forwarded-For the client sent.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
# proxy_read_timeout stays at the default 60 s; /ws raises it to an hour.
