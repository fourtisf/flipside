# coinside.fun: Nginx in front of the web app (Next.js) and the API (Fastify), both on 127.0.0.1.
# deploy/bootstrap.sh installs this file to /etc/nginx/sites-available/coinside.fun and the snippets to
# /etc/nginx/snippets. Change it here and re-run bootstrap; never edit it on the server.
#
# The server may host other sites, so every name here starts with coinside and this file never claims
# the default server. bootstrap.sh adds catch-all.conf for that only when no other site has it.

map $http_upgrade $coinside_connection {
    default upgrade;
    ''      close;
}

# 60 requests per second per IP on /api (CLAUDE.md section 10). The API's own limits in Redis arrive in P2.
limit_req_zone $binary_remote_addr zone=coinside_api:10m rate=60r/s;

# upstream coinside_web and coinside_api. bootstrap.sh writes the ports from WEB_PORT and API_PORT in
# /etc/coinside/coinside.env, so Coinside can move off ports another app already uses.
include snippets/coinside-upstreams.conf;

# HTTP: answer Let's Encrypt challenges, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name coinside.fun www.coinside.fun;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://coinside.fun$request_uri;
    }
}

# www to the bare domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.coinside.fun;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/coinside.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coinside.fun/privkey.pem;
    include snippets/coinside-tls.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://coinside.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coinside.fun;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/coinside.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coinside.fun/privkey.pem;
    include snippets/coinside-tls.conf;
    include snippets/coinside-headers.conf;
    # Behind Cloudflare's proxy, uncomment so logs and rate limits see the visitor's address:
    # include snippets/coinside-cloudflare.conf;

    access_log /var/log/nginx/coinside.access.log;
    error_log  /var/log/nginx/coinside.error.log warn;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /api/ {
        limit_req zone=coinside_api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://coinside_api;
        include snippets/coinside-proxy.conf;
        proxy_set_header Connection "";
    }

    location = /ws {
        proxy_pass http://coinside_api;
        include snippets/coinside-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coinside_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Nothing uses next/image and the optimizer is off (next.config.mjs), so its endpoint stays closed.
    location ^~ /_next/image {
        return 404;
    }

    location / {
        proxy_pass http://coinside_web;
        include snippets/coinside-proxy.conf;
        proxy_set_header Connection "";
    }
}
