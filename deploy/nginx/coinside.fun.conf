# coinside.fun: Nginx in front of the web app (Next.js on 127.0.0.1:3000) and the API (Fastify on
# 127.0.0.1:4000). deploy/bootstrap.sh installs this file to /etc/nginx/sites-available/coinside.fun and
# the snippets to /etc/nginx/snippets. Change it here and re-run bootstrap; never edit it on the server.

map $http_upgrade $coinside_connection {
    default upgrade;
    ''      close;
}

# 60 requests per second per IP on /api (CLAUDE.md section 10). The API's own limits in Redis arrive in P2.
limit_req_zone $binary_remote_addr zone=coinside_api:10m rate=60r/s;

upstream coinside_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream coinside_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# Requests for any other host name, or for the bare IP address: close the connection.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    include snippets/coinside-tls.conf;
    return 444;
}

# HTTP: answer Let's Encrypt challenges, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name coinside.fun www.coinside.fun;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://coinside.fun$request_uri;
    }
}

# www to the bare domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.coinside.fun;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/coinside.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coinside.fun/privkey.pem;
    include snippets/coinside-tls.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://coinside.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coinside.fun;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/coinside.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coinside.fun/privkey.pem;
    include snippets/coinside-tls.conf;
    include snippets/coinside-headers.conf;
    # Behind Cloudflare's proxy, uncomment so logs and rate limits see the visitor's address:
    # include snippets/coinside-cloudflare.conf;

    access_log /var/log/nginx/coinside.access.log;
    error_log  /var/log/nginx/coinside.error.log warn;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /api/ {
        limit_req zone=coinside_api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://coinside_api;
        include snippets/coinside-proxy.conf;
        proxy_set_header Connection "";
    }

    location = /ws {
        proxy_pass http://coinside_api;
        include snippets/coinside-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coinside_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://coinside_web;
        include snippets/coinside-proxy.conf;
        proxy_set_header Connection "";
    }
}
