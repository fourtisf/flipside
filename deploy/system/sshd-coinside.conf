# Installed to /etc/ssh/sshd_config.d/01-coinside.conf by `bootstrap.sh --harden-ssh`. sshd keeps the
# first value it reads, and this file sorts before cloud-init's 50-cloud-init.conf, so these win.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
MaxAuthTries 4
X11Forwarding no
