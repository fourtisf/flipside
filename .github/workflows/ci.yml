name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build

  e2e:
    name: E2E (1440 and 390) and Lighthouse accessibility
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@coinside/web
      - run: pnpm --filter @coinside/web exec playwright install --with-deps chromium
      - run: pnpm --filter @coinside/web e2e
        env:
          CI: true
      - name: Lighthouse accessibility (95 or higher on every route)
        run: |
          pnpm --filter @coinside/web start &
          npx -y wait-on@8.0.3 http://localhost:3000
          pnpm a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/test-results
            artifacts/lighthouse

  deploy:
    name: Deploy scripts (shellcheck) and Nginx config (nginx -t)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x deploy/*.sh
      - name: nginx -t on the real config, with a stand-in certificate
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx ssl-cert
          sudo install -m 0644 deploy/nginx/snippets/*.conf /etc/nginx/snippets/
          sudo install -m 0644 deploy/nginx/coinside.fun.conf /etc/nginx/sites-available/coinside.fun
          sudo ln -sfn ../sites-available/coinside.fun /etc/nginx/sites-enabled/coinside.fun
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo install -d /etc/letsencrypt/live/coinside.fun
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj /CN=coinside.fun -keyout /etc/letsencrypt/live/coinside.fun/privkey.pem \
            -out /etc/letsencrypt/live/coinside.fun/fullchain.pem
          sudo nginx -t

  vault:
    name: Vault program (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo check -p coinside_vault --locked
